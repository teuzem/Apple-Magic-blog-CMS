<VirtualHost *:80>
    ServerName applemagic.blog
    ServerAlias www.applemagic.blog

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    RequestHeader set X-Forwarded-Proto "http"
    LimitRequestBody 57671680

    ErrorLog ${APACHE_LOG_DIR}/applemagic-error.log
    CustomLog ${APACHE_LOG_DIR}/applemagic-access.log combined
</VirtualHost>
